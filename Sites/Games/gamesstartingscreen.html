    <div class="container2">
      <audio id="audio" src="../../recources/sounds/Super Mario 64 Portal Meme Sound SOUND ARCHIVE.mp3"></audio>

        <span>S</span>
        <span>t</span>

        audio.play();

            window.location.href = "games.html";
        };
      }
    </script>
